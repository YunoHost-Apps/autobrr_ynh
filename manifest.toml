#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.89.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.89.0/autobrr_1.89.0_linux_x86_64.tar.gz"
    amd64.sha256 = "9ad9484c4faca87dcc7335ec5843218ba5891caf7cf42751db986cbd6a83018f"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.89.0/autobrr_1.89.0_linux_arm64.tar.gz"
    arm64.sha256 = "686b0ffc9135a7134fbad105932417cd1cfd5d383cb72c111c2cb488502f990b"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.89.0/autobrr_1.89.0_linux_arm.tar.gz"
    armhf.sha256 = "b1ae85eed1fdbe71a067196d5d46e989c6996be1f41afa22ee145193f5e420da"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
