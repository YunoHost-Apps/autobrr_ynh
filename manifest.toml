#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.82.1~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.82.1/autobrr_1.82.1_linux_x86_64.tar.gz"
    amd64.sha256 = "d271ccc1f0c0565dd33b2b605f4ca58e4cb923a1639b97391f7f2f701dce47da"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.82.1/autobrr_1.82.1_linux_arm64.tar.gz"
    arm64.sha256 = "2e191ac30d98d8b94339f275add829608b67e9d376de3d3ef62d1e948017873e"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.82.1/autobrr_1.82.1_linux_arm.tar.gz"
    armhf.sha256 = "c4eb333e8618f46b2abbe8ba032a92ab4948f6b54e9e7a2291ab669a350ffb0e"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
