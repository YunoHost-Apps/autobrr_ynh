#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.84.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.84.0/autobrr_1.84.0_linux_x86_64.tar.gz"
    amd64.sha256 = "f4e3f342e53566f13f55b578cdc76ec5866a923d34093ac25b3fbbdf7d1120bb"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.84.0/autobrr_1.84.0_linux_arm64.tar.gz"
    arm64.sha256 = "76edb225f6afda728d36b6eacce231f4a729c9e744bbfa54e9ab1515a5ad4649"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.84.0/autobrr_1.84.0_linux_arm.tar.gz"
    armhf.sha256 = "5736f7771af616b11d7a7f78a52d6e3c9273a2b6777d07a885ca61632d7bd677"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
