#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.82.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.82.0/autobrr_1.82.0_linux_x86_64.tar.gz"
    amd64.sha256 = "996b39a678d62bb528aced283f7c6ce2ea014d8eb7c9732ec7c9815917b5fdde"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.82.0/autobrr_1.82.0_linux_arm64.tar.gz"
    arm64.sha256 = "6ac85c15e84f6acf9397cc75b9fec40c039b96047355a57b7db571a94e912cd3"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.82.0/autobrr_1.82.0_linux_arm.tar.gz"
    armhf.sha256 = "297b4e3c4568687ac8ee197b44e5e9f2895bf2a20fa8c7149d833df94b9aa5db"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
