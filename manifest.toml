#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.83.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.83.0/autobrr_1.83.0_linux_x86_64.tar.gz"
    amd64.sha256 = "de47245f5492f6b2ff15fecb6016e095e1a54bb7e03773482f0596a8bbb2857a"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.83.0/autobrr_1.83.0_linux_arm64.tar.gz"
    arm64.sha256 = "d1558c224c4edf1ff04caf628797c8edf013aeb690dac878ef5f7571f990a8c3"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.83.0/autobrr_1.83.0_linux_arm.tar.gz"
    armhf.sha256 = "3203ae942fccd2143f208c82251d571316cc212a8fa0d09be0158f4a1dd29e03"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
