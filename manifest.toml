#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.91.1~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.91.1/autobrr_1.91.1_linux_x86_64.tar.gz"
    amd64.sha256 = "069c886d28c55beac9355c0110e8845edcaa4d43b4edaf6e3cda3f0d8e974947"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.91.1/autobrr_1.91.1_linux_arm64.tar.gz"
    arm64.sha256 = "bbd1cdb010178db154e0fc88405aa075af1401498adadd37a78970ee0d91ade1"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.91.1/autobrr_1.91.1_linux_arm.tar.gz"
    armhf.sha256 = "ce3a1c40bf6176f87aacbb1f2eaa3398efacf6ba5a84e1d97c3184f7937a9845"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
