#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.81.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.81.0/autobrr_1.81.0_linux_x86_64.tar.gz"
    amd64.sha256 = "6cc8b9ad53caeaa9f568fb94b2c14f800753b4eb3e9908b9e989eec101c61c49"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.81.0/autobrr_1.81.0_linux_arm64.tar.gz"
    arm64.sha256 = "d2d1482ec03f94b6c96dd08d68262f7878f9a6c313b1211fd87b12f22e8fc2e7"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.81.0/autobrr_1.81.0_linux_arm.tar.gz"
    armhf.sha256 = "7b72c805d87d2fd3905f6ce444c2d4d018873cc7580b71abfed2d8f589bfc85f"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
