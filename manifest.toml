#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.90.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.90.0/autobrr_1.90.0_linux_x86_64.tar.gz"
    amd64.sha256 = "ec6b85ae757e18a443115461eef1291c9e578bfbf9d0468b245efb604a9956a5"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.90.0/autobrr_1.90.0_linux_arm64.tar.gz"
    arm64.sha256 = "907e742b0e5f7360a1b8d5b881f9eba5ca9f21734ba0ba254fea1fcc3652e84b"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.90.0/autobrr_1.90.0_linux_arm.tar.gz"
    armhf.sha256 = "5d6615f483720cdc219bb3d7e9df32da3a6a50e9efb7b8027d63bc5bbea8e9ed"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
