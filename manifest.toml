#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.91.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.91.0/autobrr_1.91.0_linux_x86_64.tar.gz"
    amd64.sha256 = "221119e876d82a617fdbbad14da933b8863dd817ba5fa96ee031fe72df577a87"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.91.0/autobrr_1.91.0_linux_arm64.tar.gz"
    arm64.sha256 = "f0b078e61ca72fb6dc136b97e4164d28f4a51b6abad792066acfc786521b72c2"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.91.0/autobrr_1.91.0_linux_arm.tar.gz"
    armhf.sha256 = "5f6b2c5eca705b5d55ed26eaa5d75337657d3bdd4cdf6d67975e4518ff7aa0c3"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
