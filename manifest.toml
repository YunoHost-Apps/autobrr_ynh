#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "autobrr"
name = "Autobrr"
description.en = "Easy to use download automation for torrents and usenet"
description.fr = "Automatisation de téléchargement pour les torrents et Usenet"

version = "1.86.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://autobrr.com/"
code = "https://github.com/autobrr/autobrr"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/autobrr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/autobrr/autobrr/releases/download/v1.86.0/autobrr_1.86.0_linux_x86_64.tar.gz"
    amd64.sha256 = "b8235c2f8eb72702273d7edad889caa5536513346460829e98617463e7c2f3e0"
    arm64.url = "https://github.com/autobrr/autobrr/releases/download/v1.86.0/autobrr_1.86.0_linux_arm64.tar.gz"
    arm64.sha256 = "972d625598d8aa0ec36531e320bfe8c223dd3a4c924594e4d0d71370ec9f3b69"
    armhf.url = "https://github.com/autobrr/autobrr/releases/download/v1.86.0/autobrr_1.86.0_linux_arm.tar.gz"
    armhf.sha256 = "2734579b7118fad2ae0f28c0c37be7a83e2acc7ab56d9d09a4d935bab84e1587"
    in_subdir = false
    extract = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^autobrr_.*_linux_x86_64.tar.gz$"
    autoupdate.asset.arm64 = "^autobrr_.*_linux_arm64.tar.gz$"
    autoupdate.asset.armhf = "^autobrr_.*_linux_(arm|armv6).tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
